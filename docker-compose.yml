# docker-compose.yml
version: "3.7"

networks:
  webnet:

services:
  app:
    restart: unless-stopped
    build:
      context: ./
      args:
        - PORT=${PORT}
        - NODE_ENV=${NODE_ENV}
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - BACKEND_URL=${BACKEND_URL}
      ## Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_GUEST_PORT}
      ## Queue
      - QUEUE_HOST=${REDIS_HOST}
      - QUEUE_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_PORT=${REDIS_GUEST_PORT}
    tty: true
    networks:
      - webnet
    depends_on:
      - mongodb
      - postgres
      - redis
    command: npm run start:${NODE_ENV}
    ports:
      - 0.0.0.0:${PORT}:${PORT}
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${MONGODB_APP_USER}
      - POSTGRES_PASSWORD=${MONGODB_APP_PASSWORD}
      - POSTGRES_DB=${MONGODB_INIT_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnet

  mongodb:
    image: ghcr.io/ferretdb/ferretdb:latest
    restart: unless-stopped
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://${MONGODB_APP_USER}:${MONGODB_APP_PASSWORD}@postgres:5432/${MONGODB_INIT_DATABASE}
    ports:
      - ${MONGODB_HOST_PORT}:27017
    networks:
      - webnet
    depends_on:
      - postgres
  ## Caching
  redis:
    build:
      context: ./redis
    restart: unless-stopped
    ports:
      - ${REDIS_HOST_PORT}:${REDIS_GUEST_PORT}
    volumes:
      - ${DATA_PATH}/redis:/data
    networks:
      - webnet
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]

volumes:
  postgres_data: